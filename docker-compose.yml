name: ${PROJECT:-apygg}

x-app: &app
  build:
    context: .
    dockerfile: docker/app/Dockerfile
    args:
      USER_ID: ${USER_ID:-1000}
      GROUP_ID: ${GROUP_ID:-1000}
  working_dir: /app
  env_file: .env
  volumes:
    - ./:/app
  restart: unless-stopped
  networks:
    - network

services:
  app:
    <<: *app
    container_name: ${PROJECT:-apygg}_app
    ports:
      - "${APP_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  reverb:
    <<: *app
    container_name: ${PROJECT:-apygg}_reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${REVERB_PORT:-8012}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy

  horizon:
    <<: *app
    container_name: ${PROJECT:-apygg}_horizon
    command: php artisan horizon
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  scheduler:
    <<: *app
    container_name: ${PROJECT:-apygg}_scheduler
    command: php artisan schedule:work
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: ${PROJECT:-apygg}_postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${DB_DATABASE:-apygg}
      POSTGRES_USER: ${DB_USERNAME:-apygg}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - network
    restart: unless-stopped

  redis:
    build:
      context: .
      dockerfile: docker/redis/Dockerfile
    container_name: ${PROJECT:-apygg}_redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "${REDIS_PASSWORD:-}"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - network
    restart: unless-stopped

  pgbouncer:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: docker/pgbouncer/Dockerfile
    container_name: ${PROJECT:-apygg}_pgbouncer
    ports:
      - "${PGBOUNCER_PORT:-6432}:6432"
    environment:
      PGBOUNCER_DATABASES: "* = host=postgres port=5432 dbname=${DB_DATABASE:-apygg} user=${DB_USERNAME:-apygg} password=${DB_PASSWORD:-secret}"
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 100
      PGBOUNCER_DEFAULT_POOL_SIZE: 25
      PGBOUNCER_MIN_POOL_SIZE: 5
      PGBOUNCER_RESERVE_POOL_SIZE: 5
      PGBOUNCER_RESERVE_POOL_TIMEOUT: 3
      PGBOUNCER_AUTH_TYPE: md5
      PGBOUNCER_ADMIN_USERS: ${DB_USERNAME:-apygg}
      PGBOUNCER_STATS_USERS: ${DB_USERNAME:-apygg}
      PGBOUNCER_LOGFILE: /var/log/pgbouncer/pgbouncer.log
      PGBOUNCER_PIDFILE: /var/run/pgbouncer/pgbouncer.pid
    healthcheck:
      test: ["CMD-SHELL", "pgbouncer -c 'SHOW POOLS' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - network
    restart: unless-stopped

  meilisearch:
    profiles: ["search"]
    build:
      context: .
      dockerfile: docker/meilisearch/Dockerfile
    container_name: ${PROJECT:-apygg}_meili
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-masterKey}
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - network
    restart: unless-stopped

networks:
  network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  meilidata:
