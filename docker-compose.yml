name: ${PROJECT:-apygg}

x-app: &app
  build:
    context: .
    dockerfile: docker/app/Dockerfile
    args:
      USER_ID: ${USER_ID:-1000}
      GROUP_ID: ${GROUP_ID:-1000}
  working_dir: /app
  env_file: .env
  volumes:
    - ./:/app
  restart: unless-stopped
  networks:
    - network

services:
  app:
    <<: *app
    container_name: ${PROJECT:-apygg}-app
    ports:
      - "${BIND_HOST:-127.0.0.1}:${APP_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # module:reverb:start
  reverb:
    <<: *app
    container_name: ${PROJECT:-apygg}-reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${BIND_HOST:-127.0.0.1}:${REVERB_PORT:-8012}:8080"
    healthcheck:
      # Reverb responde 404 en "/": basta con que acepte la conexión (sin -f)
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
  # module:reverb:end

  horizon:
    <<: *app
    container_name: ${PROJECT:-apygg}-horizon
    command: php artisan horizon
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  scheduler:
    <<: *app
    container_name: ${PROJECT:-apygg}-scheduler
    command: php artisan schedule:work
    # La imagen trae un healthcheck de Caddy (:2019) que no aplica a este proceso
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: ${PROJECT:-apygg}-postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${DB_DATABASE:-apygg}
      POSTGRES_USER: ${DB_USERNAME:-apygg}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements,vector"
      - "-c"
      - "jit=off"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - network
    restart: unless-stopped

  redis:
    build:
      context: .
      dockerfile: docker/redis/Dockerfile
    container_name: ${PROJECT:-apygg}-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "${REDIS_PASSWORD:-}"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - network
    restart: unless-stopped

  pgbouncer:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: docker/pgbouncer/Dockerfile
    container_name: ${PROJECT:-apygg}-pgbouncer
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PGBOUNCER_PORT:-6432}:6432"
    environment:
      PGBOUNCER_DATABASES: "* = host=postgres port=5432 dbname=${DB_DATABASE:-apygg} user=${DB_USERNAME:-apygg} password=${DB_PASSWORD:-secret}"
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 100
      PGBOUNCER_DEFAULT_POOL_SIZE: 25
      PGBOUNCER_MIN_POOL_SIZE: 5
      PGBOUNCER_RESERVE_POOL_SIZE: 5
      PGBOUNCER_RESERVE_POOL_TIMEOUT: 3
      PGBOUNCER_AUTH_TYPE: md5
      PGBOUNCER_ADMIN_USERS: ${DB_USERNAME:-apygg}
      PGBOUNCER_STATS_USERS: ${DB_USERNAME:-apygg}
      PGBOUNCER_LOGFILE: /var/log/pgbouncer/pgbouncer.log
      PGBOUNCER_PIDFILE: /var/run/pgbouncer/pgbouncer.pid
    healthcheck:
      test: ["CMD-SHELL", "pgbouncer -c 'SHOW POOLS' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - network
    restart: unless-stopped

  # module:search:start
  meilisearch:
    profiles: ["search"]
    build:
      context: .
      dockerfile: docker/meilisearch/Dockerfile
    container_name: ${PROJECT:-apygg}-meili
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-masterKey}
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${BIND_HOST:-127.0.0.1}:${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - network
    restart: unless-stopped
  # module:search:end

  # ── Servicios de desarrollo (perfil "dev"): make up-dev ─────────────────
  # Solo para trabajar en local. Puertos únicamente en 127.0.0.1.
  # Detalle: docs/local-services.md
  mailpit:
    profiles: ["dev"]
    image: axllent/mailpit:v1.34.0
    container_name: ${PROJECT:-apygg}-mailpit
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-8016}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8017}:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - network
    restart: unless-stopped

  # Emulador S3. MinIO dejó de publicar imágenes de la edición comunitaria
  # (minio/minio ya no existe en Docker Hub), así que se usa RustFS (Apache 2.0).
  s3:
    profiles: ["dev"]
    image: rustfs/rustfs:1.0.6
    container_name: ${PROJECT:-apygg}-s3
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-apygg-dev}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-apygg-dev-secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "127.0.0.1:${S3_PORT:-8018}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-8019}:9001"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - network
    restart: unless-stopped

  # Tarea de un solo uso: crea los buckets (público con lectura anónima, privado
  # sin política). Idempotente; también disponible con make s3-init.
  s3-init:
    profiles: ["dev"]
    image: curlimages/curl:8.11.1
    container_name: ${PROJECT:-apygg}-s3-init
    environment:
      S3_ENDPOINT: http://s3:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-apygg-dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-apygg-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-apygg}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-apygg-private}
    volumes:
      - ./docker/s3/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    depends_on:
      s3:
        condition: service_healthy
    networks:
      - network
    restart: "no"

networks:
  network:
    name: ${PROJECT:-apygg}-network
    driver: bridge

volumes:
  pgdata:
    name: ${PROJECT:-apygg}-pgdata
  redisdata:
    name: ${PROJECT:-apygg}-redisdata
  # module:search:start
  meilidata:
    name: ${PROJECT:-apygg}-meilidata
  # module:search:end
  s3data:
    name: ${PROJECT:-apygg}-s3data
