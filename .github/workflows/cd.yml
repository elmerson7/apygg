name: CD (manual, SSH + Docker Compose)

# Despliegue MANUAL de una imagen ya publicada por release.yml (etiqueta fija) a un VPS con Docker Compose.
# Usa los mismos scripts que `make deploy|rollback|smoke` (scripts/deploy/). Guía: docs/deploy.md
# Secrets del Environment (staging / production):
#   DEPLOY_HOST (user@host) · DEPLOY_SSH_KEY (clave privada) · DEPLOY_PATH · SMOKE_URL
#   opcionales: DEPLOY_PORT · SMOKE_EMAIL · SMOKE_PASSWORD · DEPLOY_KNOWN_HOSTS
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno'
        required: true
        type: choice
        options: [staging, production]
      image_tag:
        description: 'Etiqueta fija: sha-<commit> o vX.Y.Z (nunca latest). Vacío + rollback = volver a la anterior'
        required: false
        type: string
      rollback:
        description: 'Volver a la etiqueta anterior del servidor (ignora image_tag)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.rollback && 'Rollback' || 'Deploy' }} → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout (scripts de despliegue)
        uses: actions/checkout@v6

      - name: Validar entradas
        env:
          TAG: ${{ inputs.image_tag }}
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          if [ "$ROLLBACK" != "true" ]; then
            [[ "$TAG" =~ ^(sha-[0-9a-f]{7,40}|v[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9.]+)?)$ ]] \
              || { echo "::error::image_tag debe ser sha-<hex> o vX.Y.Z (nunca latest)"; exit 1; }
          fi

      - name: Preparar SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN" ]; then printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts; fi

      - name: Desplegar
        if: ${{ !inputs.rollback }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ~/.ssh/deploy_key
          IMAGE: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          PROJECT: ${{ vars.PROJECT || 'apygg' }}
          SMOKE_URL: ${{ secrets.SMOKE_URL }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          DEPLOY_AUTO_ROLLBACK: 'true'
        run: |
          export DEPLOY_SSH_KEY="$HOME/.ssh/deploy_key" IMAGE="${IMAGE,,}"
          bash scripts/deploy/deploy.sh deploy

      - name: Rollback
        if: ${{ inputs.rollback }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          PROJECT: ${{ vars.PROJECT || 'apygg' }}
          SMOKE_URL: ${{ secrets.SMOKE_URL }}
        run: |
          export DEPLOY_SSH_KEY="$HOME/.ssh/deploy_key"
          bash scripts/deploy/deploy.sh rollback
          [ -z "$SMOKE_URL" ] || bash scripts/deploy/deploy.sh smoke
