name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    # Evitar ejecutar CI en PRs de Dependabot automáticamente (opcional)
    # Los PRs de Dependabot seguirán ejecutando CI, pero puedes limitar workflows secundarios
  # Manual desde la pestaña Actions: también corre el job `e2e` (stack real con Docker Compose)
  workflow_dispatch:

env:
  PHP_VERSION: '8.5'

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, gd, intl, zip, opcache, bcmath, pcntl
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run Laravel Pint (Lint)
        run: ./vendor/bin/pint --test
        continue-on-error: false

      - name: Run PHPStan (Static Analysis)
        run: ./vendor/bin/phpstan analyse --memory-limit=2G
        continue-on-error: false

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: lint

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apygg_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      APP_ENV: testing
      APP_KEY: base64:Y2ktcGlwZWxpbmUta2V5LTMyLWJ5dGVzLWxvbmchISE=
      DB_CONNECTION: pgsql
      # La BD del servicio ya es la de tests (apygg_test): sin esto TestCase usaría apygg_test_test
      DB_TEST_ISOLATION: 'false'
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: apygg_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # El Redis del servicio no tiene contraseña: anula la de .env.example (que se copia a .env)
      REDIS_PASSWORD: 'null'
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      JWT_SECRET: test-jwt-secret-for-ci-pipeline-only-must-be-at-least-32-characters-long-for-256-bits-minimum-requirement
      BROADCAST_CONNECTION: log

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, gd, intl, zip, opcache, bcmath, pcntl
          coverage: pcov

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel application
        run: |
          cp .env.example .env || true
          php artisan key:generate --force
          php artisan config:clear
          php artisan cache:clear

      - name: Run database migrations
        run: php artisan migrate --force --env=testing

      # Suite por defecto (Unit + Feature + Arch) con cobertura. Mínimo = COVERAGE_MIN de
      # make/test.mk (cobertura medida redondeada a múltiplo de 5): súbelo con la cobertura.
      - name: Run Pest tests (coverage minimum)
        # memory_limit lo fija phpunit.xml (4G): el informe de cobertura de la suite completa pasa de 1 GB
        run: ./vendor/bin/pest --ci --coverage --coverage-clover=coverage.xml --min=80
        continue-on-error: false

      # Suites a propósito (no están en la por defecto). Concurrency compromete datos en la BD
      # de tests (procesos PHP hijos), por eso va DESPUÉS de la cobertura.
      - name: Run Contract and Concurrency suites
        run: ./vendor/bin/pest --ci --testsuite=Contract,Concurrency

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  test-prefix:
    name: Tests con API_PREFIX=v1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apygg_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      APP_ENV: testing
      APP_KEY: base64:Y2ktcGlwZWxpbmUta2V5LTMyLWJ5dGVzLWxvbmchISE=
      DB_CONNECTION: pgsql
      # La BD del servicio ya es la de tests (apygg_test): sin esto TestCase usaría apygg_test_test
      DB_TEST_ISOLATION: 'false'
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: apygg_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # El Redis del servicio no tiene contraseña: anula la de .env.example (que se copia a .env)
      REDIS_PASSWORD: 'null'
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      JWT_SECRET: test-jwt-secret-for-ci-pipeline-only-must-be-at-least-32-characters-long-for-256-bits-minimum-requirement
      BROADCAST_CONNECTION: log
      # Prefijo de versión opcional: toda la suite con la API colgando de /v1 (docs/api-routes-conventions.md)
      API_PREFIX: v1

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, gd, intl, zip, opcache, bcmath, pcntl
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel application
        run: |
          cp .env.example .env || true
          php artisan key:generate --force
          php artisan config:clear
          php artisan cache:clear

      - name: Run database migrations
        run: php artisan migrate --force --env=testing

      # Misma suite por defecto, Contract y Concurrency, con la API bajo /v1: las URLs de los tests llevan el
      # prefijo (tests/TestCase.php) salvo las rutas de infraestructura (config/api.php `unprefixed`).
      - name: Run Pest tests (API_PREFIX=v1)
        run: ./vendor/bin/pest --ci

      - name: Run Contract and Concurrency suites (API_PREFIX=v1)
        run: ./vendor/bin/pest --ci --testsuite=Contract,Concurrency

  # Cambios que rompen a las apps móviles ya publicadas: compara docs/openapi.json con el de la base (rama destino
  # del PR, o el commit anterior en push) con oasdiff (imagen de versión fija). Detalle y escapes (archivo de
  # excepciones, etiqueta `breaking-change-approved`): docs/api-routes-conventions.md "Versiones y apps móviles".
  openapi-breaking:
    name: Cambios que rompen (oasdiff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determinar la referencia base
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            ref="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            ref="$BEFORE"
          elif git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            ref="HEAD~1"
          else
            ref=""
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: oasdiff breaking
        if: steps.base.outputs.ref != ''
        env:
          ALLOW_BREAKING: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change-approved') && '1' || '0' }}
        run: bash scripts/openapi-breaking.sh "${{ steps.base.outputs.ref }}"

  security:
    name: Security Scan (Composer Audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-dev

      # El job DEBE fallar si hay vulnerabilidades. Antes tenía `|| true` y
      # `continue-on-error`, así que solo imprimía: por eso pasaron
      # inadvertidos 57 avisos, 4 de ellos críticos.
      - name: Run Composer audit
        run: composer audit --locked

      # Las dependencias de desarrollo también importan: se ejecutan en CI y en
      # las máquinas del equipo. Se avisa, pero no se bloquea el despliegue.
      - name: Run Composer audit (incluyendo dev)
        run: composer audit
        continue-on-error: true

  # Migraciones: linter de patrones peligrosos + aplicar las nuevas sobre el esquema de la versión
  # anterior (base del PR o commit previo) y comprobar que son reversibles. docs/migrations.md §10.
  migrations:
    name: Migraciones (lint, upgrade y rollback)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apygg_migrations
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      APP_ENV: testing
      APP_KEY: base64:Y2ktcGlwZWxpbmUta2V5LTMyLWJ5dGVzLWxvbmchISE=
      DB_CONNECTION: pgsql
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: apygg_migrations
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      JWT_SECRET: test-jwt-secret-for-ci-pipeline-only-must-be-at-least-32-characters-long-for-256-bits-minimum-requirement
      BROADCAST_CONNECTION: log

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, gd, intl, zip, opcache, bcmath, pcntl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel application
        run: |
          cp .env.example .env || true
          php artisan config:clear

      - name: Lint de migraciones
        run: php artisan migrations:lint

      - name: Aplicar sobre la versión anterior y revertir
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # Primer push de una rama o ref base inexistente: se usa el padre del commit.
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE="HEAD~1"
          bash scripts/ci-migrations-check.sh "$BASE"

  # Módulos opcionales (docs/modules.md): prueba que un derivado puede quitarlos con `module:remove` y que la
  # app arranca y la suite restante pasa. Escenarios: sin ninguno opcional, solo sin billing, solo sin backoffice.
  # El orden importa: un módulo se quita antes que aquel del que depende (docs-assistant -> llm, load-testing -> seed-load -> billing).
  modules-removed:
    name: Sin módulos (${{ matrix.escenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        # Un escenario con todos los módulos opcionales quitados y uno por módulo. Los dependientes se quitan
        # antes que su dependencia (docs-assistant → llm, load-testing → seed-load → billing).
        # ModulosMatrizCiTest comprueba que cada módulo con 'core' => false tiene su escenario.
        include:
          - escenario: todos
            modulos: docs-assistant llm backoffice load-testing seed-load billing export-import maintenance privacy search reverb impersonation metrics offline-sync otp-login social-login frontend-demo
          - escenario: backoffice
            modulos: backoffice
          - escenario: billing
            modulos: load-testing seed-load billing
          - escenario: docs-assistant
            modulos: docs-assistant
          - escenario: export-import
            modulos: export-import
          - escenario: frontend-demo
            modulos: frontend-demo
          - escenario: impersonation
            modulos: impersonation
          - escenario: llm
            modulos: docs-assistant llm
          - escenario: load-testing
            modulos: load-testing
          - escenario: maintenance
            modulos: maintenance
          - escenario: metrics
            modulos: metrics
          - escenario: offline-sync
            modulos: offline-sync
          - escenario: otp-login
            modulos: otp-login
          - escenario: privacy
            modulos: privacy
          - escenario: reverb
            modulos: reverb
          - escenario: search
            modulos: search
          - escenario: seed-load
            modulos: load-testing seed-load
          - escenario: social-login
            modulos: social-login

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apygg_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      APP_ENV: testing
      APP_KEY: base64:Y2ktcGlwZWxpbmUta2V5LTMyLWJ5dGVzLWxvbmchISE=
      DB_CONNECTION: pgsql
      DB_TEST_ISOLATION: 'false'
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: apygg_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # El Redis del servicio no tiene contraseña: anula la de .env.example (que se copia a .env)
      REDIS_PASSWORD: 'null'
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      JWT_SECRET: test-jwt-secret-for-ci-pipeline-only-must-be-at-least-32-characters-long-for-256-bits-minimum-requirement
      BROADCAST_CONNECTION: log

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, gd, intl, zip, opcache, bcmath, pcntl
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel application
        run: |
          cp .env.example .env || true
          php artisan key:generate --force
          php artisan config:clear

      - name: Quitar módulos (${{ matrix.modulos }})
        run: |
          for m in ${{ matrix.modulos }}; do
            # En un derivado que ya quitó el módulo, su escenario no tiene nada que quitar.
            if [ ! -f "modules/$m.php" ]; then echo "módulo $m ya no existe: se omite"; continue; fi
            php artisan module:remove "$m" --no-verify
          done
          composer dump-autoload --optimize

      - name: La app arranca sin esos módulos
        run: |
          php artisan about
          php artisan route:list > /dev/null

      - name: Migrar (incluye la migración de baja de cada módulo)
        run: php artisan migrate --force --env=testing

      # `--no-verify` no regenera el contrato: al quitar rutas docs/openapi.json cambia (lo exige un test).
      - name: Regenerar docs/openapi.json
        run: php artisan openapi:export

      - name: Suite restante
        run: ./vendor/bin/pest --ci

  # Recorridos E2E por HTTP real (tests/E2E): levantan su propio stack con Docker Compose (docker-compose.e2e.yml:
  # app con Octane, Horizon, Postgres 18, Redis, Mailpit, S3/RustFS) y cubren alta de empresa, invitaciones,
  # facturación, bloqueo, archivos, sesiones y 2FA. Es lento y necesita Docker,
  # por eso solo corre en push a main y a mano (workflow_dispatch). No bloquea `ci-success`.
  e2e:
    name: E2E (stack real)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, gd, intl, zip, opcache, bcmath, pcntl
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # vendor/ se instala en el host (con caché) y el contenedor lo reutiliza: `make setup`
      # solo tiene que comprobarlo en vez de descargar todo otra vez.
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Init project (compose.env y .env)
        run: make init NAME=ci PORT_BASE=8700 YES=1

      # Stack efímero propio de la suite (docker-compose.e2e.yml): app con Octane, Horizon, Postgres, Redis,
      # Mailpit y S3 local, con multiempresa, facturación fake y los filtros SSRF/límites relajados SOLO para
      # este stack. `make e2e` lo levanta, migra, corre tests/E2E y lo baja con `down -v` (también si falla).
      - name: Run E2E suite (stack efímero)
        run: make e2e

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test, security]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/app/Dockerfile
          push: false
          load: true
          tags: apygg:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            USER_ID=1000
            GROUP_ID=1000

      - name: Test Docker image
        run: |
          docker run --rm apygg:ci-test php --version
          docker run --rm apygg:ci-test php artisan --version
          docker run --rm apygg:ci-test composer --version

  ci-success:
    name: CI Pipeline Success
    runs-on: ubuntu-latest
    needs: [lint, test, test-prefix, security, build, migrations, modules-removed, openapi-breaking]
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.test-prefix.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.migrations.result }}" != "success" ] || \
             [ "${{ needs.modules-removed.result }}" != "success" ] || \
             [ "${{ needs.openapi-breaking.result }}" != "success" ]; then
            echo "❌ CI Pipeline failed"
            exit 1
          fi
          echo "✅ All CI checks passed"
