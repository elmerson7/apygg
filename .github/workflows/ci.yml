name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    # Evitar ejecutar CI en PRs de Dependabot automáticamente (opcional)
    # Los PRs de Dependabot seguirán ejecutando CI, pero puedes limitar workflows secundarios
  # Manual desde la pestaña Actions: también corre el job `e2e` (stack real con Docker Compose)
  workflow_dispatch:

env:
  PHP_VERSION: '8.5'

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, gd, intl, zip, opcache, bcmath, pcntl
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run Laravel Pint (Lint)
        run: ./vendor/bin/pint --test
        continue-on-error: false

      - name: Run PHPStan (Static Analysis)
        run: ./vendor/bin/phpstan analyse --memory-limit=2G
        continue-on-error: false

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apygg_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      APP_ENV: testing
      APP_KEY: base64:Y2ktcGlwZWxpbmUta2V5LTMyLWJ5dGVzLWxvbmchISE=
      DB_CONNECTION: pgsql
      # La BD del servicio ya es la de tests (apygg_test): sin esto TestCase usaría apygg_test_test
      DB_TEST_ISOLATION: 'false'
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: apygg_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      JWT_SECRET: test-jwt-secret-for-ci-pipeline-only-must-be-at-least-32-characters-long-for-256-bits-minimum-requirement
      BROADCAST_CONNECTION: log

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, gd, intl, zip, opcache, bcmath, pcntl
          coverage: xdebug

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel application
        run: |
          cp .env.example .env || true
          php artisan key:generate --force
          php artisan config:clear
          php artisan cache:clear

      - name: Run database migrations
        run: php artisan migrate --force --env=testing

      # Suite por defecto (Unit + Feature + Arch) con cobertura. Mínimo = COVERAGE_MIN de
      # make/test.mk (cobertura medida redondeada a múltiplo de 5): súbelo con la cobertura.
      - name: Run Pest tests (coverage minimum)
        run: ./vendor/bin/pest --ci --coverage --coverage-clover=coverage.xml --min=55
        continue-on-error: false
        env:
          XDEBUG_MODE: coverage

      # Suites a propósito (no están en la por defecto). Concurrency compromete datos en la BD
      # de tests (procesos PHP hijos), por eso va DESPUÉS de la cobertura.
      - name: Run Contract and Concurrency suites
        run: ./vendor/bin/pest --ci --testsuite=Contract,Concurrency

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  security:
    name: Security Scan (Composer Audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-dev

      # El job DEBE fallar si hay vulnerabilidades. Antes tenía `|| true` y
      # `continue-on-error`, así que solo imprimía: por eso pasaron
      # inadvertidos 57 avisos, 4 de ellos críticos.
      - name: Run Composer audit
        run: composer audit --locked

      # Las dependencias de desarrollo también importan: se ejecutan en CI y en
      # las máquinas del equipo. Se avisa, pero no se bloquea el despliegue.
      - name: Run Composer audit (incluyendo dev)
        run: composer audit
        continue-on-error: true

  # Recorrido E2E por HTTP real (tests/E2E): levanta el stack del perfil dev con Docker Compose
  # (app con Octane, Horizon, Postgres 18, Redis, Mailpit, S3/RustFS). Es lento y necesita Docker,
  # por eso solo corre en push a main y a mano (workflow_dispatch). No bloquea `ci-success`.
  e2e:
    name: E2E (stack real)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, gd, intl, zip, opcache, bcmath, pcntl
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # vendor/ se instala en el host (con caché) y el contenedor lo reutiliza: `make setup`
      # solo tiene que comprobarlo en vez de descargar todo otra vez.
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Init project (compose.env y .env)
        run: make init NAME=ci PORT_BASE=8700 YES=1

      # El receptor de webhooks de la prueba es http y vive en la red de Compose (host `app`):
      # sin esto WebhookUrlGuard lo rechaza. Solo para este stack efímero. Archivos en S3 local.
      - name: Configure E2E environment
        run: |
          sed -i 's/^FILE_DISK_PUBLIC=.*/FILE_DISK_PUBLIC=s3/; s/^FILE_DISK_PRIVATE=.*/FILE_DISK_PRIVATE=s3_private/' .env
          printf 'WEBHOOKS_ALLOW_HTTP=true\nWEBHOOKS_ALLOWED_HOSTS=app\n' >> .env

      - name: Start the stack (make setup)
        run: make setup

      - name: Run E2E suite
        run: make test-e2e

      - name: Dump container logs on failure
        if: failure()
        run: docker compose --profile dev --project-name ci --env-file compose.env logs --tail=200

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test, security]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/app/Dockerfile
          push: false
          load: true
          tags: apygg:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            USER_ID=1000
            GROUP_ID=1000

      - name: Test Docker image
        run: |
          docker run --rm apygg:ci-test php --version
          docker run --rm apygg:ci-test php artisan --version
          docker run --rm apygg:ci-test composer --version

  ci-success:
    name: CI Pipeline Success
    runs-on: ubuntu-latest
    needs: [lint, test, security, build]
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ CI Pipeline failed"
            exit 1
          fi
          echo "✅ All CI checks passed"
