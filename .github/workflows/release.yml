name: Release (imagen inmutable)

# Construye la imagen de PRODUCCIÓN (docker/app/Dockerfile.prod), la escanea y la publica en GHCR con etiquetas fijas:
#   sha-<commit corto>   en cada push a main y en cada tag
#   vX.Y.Z               en tags v*
# `latest` NUNCA se publica ni se usa para desplegar. Guía: docs/deploy.md
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: Build, scan & push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
      image: ${{ steps.vars.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Variables
        id: vars
        run: |
          short="$(git rev-parse --short=7 HEAD)"
          echo "sha_tag=sha-${short}" >> "$GITHUB_OUTPUT"
          # GHCR exige minúsculas
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas y labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.vars.outputs.sha_tag }}
            type=ref,event=tag

      # 1) Construye y carga en local para escanear ANTES de publicar (las capas quedan en caché para el push)
      - name: Build (local, para escanear)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/app/Dockerfile.prod
          load: true
          push: false
          tags: apygg-scan:${{ steps.vars.outputs.sha_tag }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_RELEASE=${{ steps.vars.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Escaneo de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: apygg-scan:${{ steps.vars.outputs.sha_tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          vuln-type: os,library

      - name: Humo de la imagen (arranca y responde /health/live)
        run: |
          docker run --rm apygg-scan:${{ steps.vars.outputs.sha_tag }} php -v
          docker run --rm apygg-scan:${{ steps.vars.outputs.sha_tag }} sh -c 'id -u | grep -vx 0 && php -m | grep -qi opcache && ! test -d vendor/phpunit'

      # 2) Publica (mismas capas) con SBOM y provenance
      - name: Push a GHCR
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/app/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_RELEASE=${{ steps.vars.outputs.sha_tag }}
          cache-from: type=gha

      - name: Resumen
        run: |
          {
            echo "### Imagen publicada"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.push.outputs.digest }}"
            echo '```'
            echo "Desplegar: Actions → CD → image_tag=\`${{ steps.vars.outputs.sha_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
