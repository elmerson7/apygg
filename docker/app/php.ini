memory_limit=512M
upload_max_filesize=50M
post_max_size=52M
opcache.enable=1
opcache.jit_buffer_size=64M
; ──────────────────────────────────────────────────────────────────────
; Cobertura de código (pcov)
; ──────────────────────────────────────────────────────────────────────
; Desactivado por defecto: con pcov.enabled=1 activo, todo el código se
; instrumenta y la aplicación va notablemente más lenta.
; `make test-coverage` lo enciende solo para esa ejecución.
pcov.enabled=0
pcov.directory=/app/app
